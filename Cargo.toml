[workspace]
resolver = "3"
members = ["omt","omt-sys"]
# `fuzz` is a stand-alone crate: `cargo fuzz` needs nightly, the workspace is
# pinned to stable. Excluding it keeps root builds from reaching for it.
exclude = ["fuzz"]

[workspace.package]
authors = ["Udo Schneider <Udo.Schneider@homeaddress.de>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/udoschneider/omt-rs"
rust-version = "1.93"
