name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.93.0"

jobs:
  # ---------------------------------------------------------------------------
  # Fast tier: formatting + lints. Does NOT need libomt.so, because `fmt` and
  # `clippy` only type-check (no final link). bindgen still runs during the
  # build-script phase, so libclang must be present; the C header itself is
  # vendored at omt-sys/libomt.h.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install libclang (required by bindgen)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ---------------------------------------------------------------------------
  # Fast tier: supply-chain audit. Scans the committed Cargo.lock for crates
  # with known RUSTSEC advisories. Needs neither libomt.so nor a full build, so
  # it lives alongside the lint job in the lighter tier.
  #
  # Runs `cargo audit` directly (rather than the rustsec/audit-check action) so
  # that `.cargo/audit.toml` is honored deterministically — that file ignores two
  # informational "unmaintained" advisories in transitive dev-dependencies that
  # have no available fix. Vulnerabilities and any advisory with a patched
  # version are NOT ignored and still fail this job.
  # ---------------------------------------------------------------------------
  audit:
    name: Audit (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit

  # ---------------------------------------------------------------------------
  # Fast tier: cross-compile type-check for aarch64. `c_char` is signed (`i8`) on
  # x86_64 but unsigned (`u8`) on Linux aarch64/arm, so bindgen emits different
  # element types for the libomt char arrays there. This job re-runs bindgen for
  # the aarch64 target (cargo exports TARGET, which bindgen forwards to libclang)
  # and type-checks the crate against those bindings, catching portability
  # regressions the x86_64 jobs cannot. `cargo check` does not link, so no
  # aarch64 libomt.so is required — only the vendored header and libclang.
  # ---------------------------------------------------------------------------
  cross-arm64:
    name: Cross-check (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install libclang + aarch64 cross sysroot (for bindgen)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev gcc-aarch64-linux-gnu

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} (aarch64 target)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      # Check only the library crates: their public API is where the char-buffer
      # portability lives, and this avoids cross-compiling the heavy native
      # dev-dependencies (image, viuer) pulled in by --all-targets.
      - name: cargo check (aarch64-unknown-linux-gnu)
        run: cargo check -p omt-sys -p omt --target aarch64-unknown-linux-gnu
        env:
          # Point bindgen's libclang at the aarch64 sysroot so any system header
          # it pulls in resolves for the cross target.
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu: "--sysroot=/usr/aarch64-linux-gnu"

  # ---------------------------------------------------------------------------
  # Full tier: build the native libomt from the upstream .NET sources, install
  # it, then run the real test suite (unit + integration + doctests), build the
  # examples, and check the docs. This is what verifies the memory-safety
  # invariants the crate documents.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & test (native libomt)
    runs-on: ubuntu-latest
    steps:
      # Check out this repo into a subdirectory so the upstream repos can sit
      # next to it as siblings, which the libomt build scripts require.
      - name: Checkout omt-rs
        uses: actions/checkout@v5
        with:
          path: omt-rs

      - name: Checkout libomtnet (managed dependency)
        uses: actions/checkout@v5
        with:
          repository: openmediatransport/libomtnet
          path: libomtnet

      - name: Checkout libomt (native C wrapper)
        uses: actions/checkout@v5
        with:
          repository: openmediatransport/libomt
          path: libomt

      - name: Install native toolchain for .NET AOT
        run: sudo apt-get update && sudo apt-get install -y clang lld zlib1g-dev build-essential libclang-dev

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Build order matters: libomt references a prebuilt libomtnet.dll by path.
      - name: Build libomtnet (Release)
        working-directory: libomtnet/build
        run: bash ./buildall.sh

      - name: Build libomt (Native AOT, linux-x64)
        working-directory: libomt/build
        run: bash ./buildlinuxx64.sh

      - name: Install libomt.so
        run: |
          sudo cp libomt/bin/Release/net8.0/linux-x64/native/libomt.so /usr/local/lib/
          sudo ldconfig

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: omt-rs

      - name: cargo build --examples
        working-directory: omt-rs
        run: cargo build --workspace --examples

      # Discovery browses via Avahi/mDNS; without a running daemon the C library
      # gets a null Avahi client and abort()s the whole test process (SIGABRT).
      # The discovery_safety_tests deliberately exercise this path, so provide a
      # real daemon rather than skipping them.
      - name: Start Avahi daemon (required for discovery tests)
        run: |
          sudo apt-get install -y avahi-daemon libavahi-client3
          sudo systemctl start dbus
          sudo systemctl start avahi-daemon
          for _ in $(seq 1 10); do
            systemctl is-active --quiet avahi-daemon && break
            sleep 1
          done
          systemctl is-active avahi-daemon

      - name: cargo test
        working-directory: omt-rs
        run: cargo test --workspace

      - name: cargo doc
        working-directory: omt-rs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # ---------------------------------------------------------------------------
  # Full tier (macOS): build, test and doc against an environment with no
  # preinstalled libomt, relying entirely on the pinned prebuilt download in
  # `omt-sys/build.rs` (SHA-256-verified release zip, cached under
  # ~/.cargo/omt). Verifies the download/link/rpath path and the README's macOS
  # support claim. Lint, format and audit stay Linux-only — they are
  # platform-independent and would only duplicate work here.
  # Windows is claimed as supported but deliberately not CI-covered yet: the
  # discovery tests depend on Avahi-style mDNS behavior that has not been
  # validated on hosted Windows runners.
  # ---------------------------------------------------------------------------
  macos-build-and-test:
    name: Build & test (macOS, prebuilt libomt)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --examples
        run: cargo build --workspace --examples

      - name: cargo test
        run: cargo test --workspace

      - name: cargo doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
