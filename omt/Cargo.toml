[package]
name = "omt"
version = "0.1.0"
description = "Safe, idiomatic Rust bindings for Open Media Transport (OMT)"
documentation = "https://docs.rs/omt"
readme = "README.md"
keywords = ["omt", "video", "audio", "multimedia", "streaming"]
categories = ["multimedia::video", "multimedia::audio", "api-bindings"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Exposes `omt::fuzzing`, a hidden, semver-exempt harness used by the `fuzz/`
# crate to drive frame headers the safe public API cannot construct. Off by
# default; not for application use.
unstable-fuzzing = []

[dependencies]
omt-sys = { path = "../omt-sys", version = "0.1.0" }
thiserror = "2.0"
bitflags = "2.6"
rgb = "0.8.52"
yuv = "0.8.11"

[dev-dependencies]
image = "0.25"
clap = { version = "4.5", features = ["derive"] }
viuer = "0.11.0"
